[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-dreame-lawn-mower"
version = "0.2.139"
description = "HACS-ready Dreame and MOVA lawn mower integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Community Maintainers" }]
dependencies = [
  "aiohttp>=3.11.11",
  "numpy",
  "paho-mqtt",
  "pillow",
  "quickjs-ng==0.16.2.1",
  "pybase64",
  "pycryptodome",
  "python-miio",
  "requests"
]

[project.optional-dependencies]
test = [
  "mypy==2.4.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-homeassistant-custom-component>=0.13.201",
  "ruff>=0.11.0"
]

[tool.setuptools.packages.find]
include = [
  "custom_components*",
  "dreame_lawn_mower_client*",
  "tests*"
]

[tool.setuptools.package-data]
"custom_components.dreame_lawn_mower" = [
  "manifest.json",
  "services.yaml",
  "strings.json",
  "translations/*.json",
  "brand/*.png"
]
"custom_components.dreame_lawn_mower.dreame_lawn_mower_client" = [
  "certs/*.pem"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Minimum HA uses Requests 2.32 and Paho MQTT 1.6 without type markers.
# Exempt only these third-party imports when type information is unavailable;
# typed installations and all integration/bundled-client modules stay checked.
module = ["requests", "paho", "paho.mqtt", "paho.mqtt.client", "paho.mqtt.enums"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Requests 2.32 in minimum HA has no type marker. Infer its exception
# definitions while retaining strict checks for integration and client code.
module = ["requests.exceptions"]
follow_untyped_imports = true

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
  # These inherited implementation owners retain upstream style debt. They are
  # named explicitly so new reusable client modules remain under normal linting.
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/const.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/device.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/device_commands.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/device_map.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/device_state.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/device_status.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/map.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/map_editor.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/map_manager.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/map_renderer.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/protocol.py",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/protocol_cloud.py",
  # Generated modules contain large single-line encoded assets.
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/resource_data/",
  "custom_components/dreame_lawn_mower/dreame_lawn_mower_client/resources.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
