start_scheduled_mowing:
  name: Start guarded scheduled mowing
  description: >-
    Refresh eligibility and start an explicit task, or skip immediately with a
    reason. Requires a docked, online mower, known inactive task and rain-delay
    state, sufficient battery, and disabled native schedules on every map.
    Defaults skip immediately without queueing, interrupting or resuming. Optional
    external permission, bounded deferral and same-task pause recovery apply only
    to this managed run. Returns per-entity status and reason when requested.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    permission_entity:
      name: External mowing permission
      description: Optional on/off helper; only a valid on permits a start. Its reason attribute explains blocks.
      default: ""
      selector:
        entity:
          filter:
            domain: [binary_sensor, input_boolean, switch]
    permission_max_age:
      name: Maximum permission report age
      description: Seconds since its last report; zero disables only the age check. Composite helpers must check their source freshness.
      default: 1800
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    defer_minutes:
      name: Deferred-start window
      description: Zero skips immediately. A positive value retains one pending attempt until this many minutes after the request.
      default: 0
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    interruption:
      name: Action when permission is lost
      default: none
      selector:
        select:
          options: [none, pause, dock]
    resume_when_allowed:
      name: Resume the owned paused task
      description: Requires pause and a positive recovery window. Never resumes after restart/reload, manual intervention or a task/map change.
      default: false
      selector:
        boolean: {}
    recovery_minutes:
      name: Recovery window
      description: Latest resume, in minutes from the original request. Zero disables automatic recovery.
      default: 0
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    automation_entity:
      name: Owning automation or switch
      description: Optional automation or switch entity; turning it off or toggling it revokes pending starts and recovery. Reloading automations also cancels authority. The blueprint and built-in wizard supply their owner automatically.
      selector:
        entity:
          filter:
            domain:
              - automation
              - switch
    run_id:
      name: Scheduled occurrence ID
      description: Optional stable ID for deduplication of this scheduled occurrence. The most recent accepted ID survives restart.
      selector:
        text: {}
    task_type:
      name: Mowing task
      default: all
      selector:
        select:
          options: [all, zone, edge, spot]
    minimum_battery:
      name: Minimum battery
      default: 30
      selector:
        number:
          min: 20
          max: 100
          step: 1
          unit_of_measurement: "%"
    map_index:
      name: Target map index
      description: Required for zone, edge, and spot tasks; must be the current saved map.
      example: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    zone_ids:
      name: Saved zone IDs
      example: [1, 3]
      selector:
        object: {}
    contour_ids:
      name: Saved contour pairs
      example: [[1, 0]]
      selector:
        object: {}
    spot_ids:
      name: Saved spot IDs
      example: [2, 4]
      selector:
        object: {}

cancel_scheduled_mowing:
  name: Cancel managed mowing automation
  description: Cancel pending starts and automatic recovery without moving the mower. Use normal pause or dock separately to interrupt physical mowing.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower

set_rotation_zone_rest_days:
  name: Set a zone's rotation rest days
  description: >-
    Give one saved zone its own rest days in the Mowing automation's zone
    rotation, or omit rest days to use the automation default again. Applies
    at once without reloading the integration.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    map_index:
      name: Map index
      description: Optional expected current map. Rejects the request if the map changed before it arrived.
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    zone_id:
      name: Zone ID
      description: Saved zone ID on the current map.
      required: true
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    rest_days:
      name: Rest days
      description: Days the zone rests after a completion (0 = once a day). Omit to use the default.
      selector:
        number:
          min: 0
          max: 30
          mode: box
          unit_of_measurement: d

start_zone_mowing:
  name: Start zone mowing
  description: >-
    Start mower-native mowing for one or more saved zones on the active map and
    confirm that mowing started. Exact zone confirmation depends on the mower
    publishing native task metadata.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    zone_ids:
      name: Zone IDs
      description: List of saved Dreame zone IDs to mow, for example [1, 3].
      required: true
      example: [1, 3]

start_spot_mowing:
  name: Start spot mowing
  description: >-
    Start mower-native mowing for one or more saved spot areas on the active map
    and confirm that mowing started. Exact spot confirmation depends on the mower
    publishing native task metadata.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    spot_ids:
      name: Spot IDs
      description: List of saved Dreame spot area IDs to mow, for example [2, 4].
      required: true
      example: [2, 4]

start_edge_mowing:
  name: Start edge mowing
  description: >-
    Start mowing for one or more explicit current-map edge contour IDs and
    confirm that mowing started. Exact mode confirmation depends on the mower
    publishing native task metadata. Each contour ID is a two-item
    list in the form [edge_id, contour_index].
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    contour_ids:
      name: Contour IDs
      description: List of edge contour ids, for example [[1, 0]].
      required: true
      example: [[1, 0]]
      selector:
        object: {}

start_point_patrol:
  name: Start point patrol
  description: >-
    Send the mower to visit configured patrol points on the active map without
    mowing. When point_ids is omitted, every patrol point on the active map is
    visited. Use while the mower is docked or otherwise idle. Observed on MOVA
    LiDAX Ultra 1000 firmware; other models may reject the request.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    point_ids:
      name: Patrol point IDs
      description: >-
        Optional list of patrol point IDs from the active map, for example
        [1, 2, 3]. Omit to visit all patrol points.
      required: false
      example: [1, 2, 3]
    zone_ids:
      name: Zone IDs
      description: >-
        Optional list of lawn zone ids. Visits only the patrol points located
        inside these zones. Do not combine with point_ids.
      required: false
      example: [1]

start_edge_patrol:
  name: Start edge patrol
  description: >-
    Drive along one or more explicit current-map edge contours without mowing.
    Each contour ID is a two-item list in the form [edge_id, contour_index].
    Use while the mower is docked or otherwise idle. Observed on MOVA LiDAX
    Ultra 1000 firmware; other models may reject the request.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    contour_ids:
      name: Contour IDs
      description: >-
        List of edge contour ids, for example [[1, 0]]. Omit to patrol the
        outer edge of every zone on the active map.
      required: false
      example: [[1, 0]]
      selector:
        object: {}

download_session_photos:
  name: Download session photos
  description: >-
    Save the photos attached to the latest finished task sessions (for example
    point patrol photos) to the Home Assistant media folder under
    dreame_lawn_mower, grouped by entity and cloud object. Already saved photos are skipped.
    Limited to 100 photos and 64 MiB per call, with a 256 MiB archive per entity.
    Observed on
    MOVA LiDAX Ultra 1000 firmware; other models may not publish session photos.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    session_count:
      name: Session count
      description: Number of latest finished task sessions to read.
      required: false
      default: 1
      example: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box

download_person_photo:
  name: Download person photo
  description: >-
    Save the photo the mower took when it detected a person to the Home
    Assistant media folder, next to the session photos. Without detected_at, the
    latest retained human-detection notice (code 27) is used. Observed on MOVA
    LiDAX Ultra 1000 firmware; other models may store person photos differently.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    detected_at:
      name: Detected at
      description: >-
        When the human-detection notice was observed. Defaults to the latest
        retained detection.
      required: false
      selector:
        datetime:

play_audio:
  name: Play audio through the mower
  description: >-
    Play a local audio file through the mower speaker, like the app's talk
    button. The audio uses the live video connection, which this action opens
    when needed and releases afterwards. The file is converted with ffmpeg to
    16 kHz mono AAC and limited to 60 seconds. The path must be in an allowed
    directory such as /media. Use the cloud video transport. Supported files
    include MP3, WAV, AAC, FLAC, Ogg, M4A/MP4 and Matroska; playlists and remote
    URLs are rejected.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: camera
      supported_features:
        - camera.CameraEntityFeature.STREAM
  fields:
    file_path:
      name: File path
      description: Local path of the audio file, for example /media/hello.mp3.
      required: true
      example: /media/hello.mp3
      selector:
        text:

switch_current_map:
  name: Switch current map
  description: >-
    Switch the mower's active app map by app map index. This updates the real
    active mower map, not just the local Home Assistant selection scope. Use
    while the mower is docked or otherwise idle; the vendor protocol may reject
    the request while mowing.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    map_index:
      name: Map index
      description: App map index to activate, for example 0 or 1.
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 20
          step: 1
          mode: box

cancel_current_task:
  name: Cancel current task
  description: >-
    End the mower's current mowing task without sending it to the dock. The
    service waits for authoritative inactive state before completing, so a map
    switch can safely follow it. Calling it while already idle has no effect.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower

set_georeference:
  name: Set map georeference
  description: >-
    Store the calibration that converts native map coordinates (millimetres)
    to GPS. One map point, usually the charging station, is tied to its
    latitude and longitude; the heading is the compass direction of the map's
    native +Y axis. The calibration belongs to the verified current map and
    revision. Saving it does not reload the integration or reconnect the mower.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    anchor_x:
      name: Anchor X
      description: Native X coordinate of the anchor point, as in the map camera's charger_x.
      required: true
      example: 1160
      selector:
        number:
          step: any
          mode: box
    anchor_y:
      name: Anchor Y
      description: Native Y coordinate of the anchor point, as in the map camera's charger_y.
      required: true
      example: -20
      selector:
        number:
          step: any
          mode: box
    latitude:
      name: Latitude
      description: Latitude of the anchor point, in degrees.
      required: true
      example: 45.317421
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Longitude
      description: Longitude of the anchor point, in degrees.
      required: true
      example: -73.837131
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    heading:
      name: Heading
      description: >-
        Compass heading of the native +Y map axis, in degrees clockwise from
        north. Values outside 0-360 are normalized.
      required: true
      example: 227.33
      selector:
        number:
          step: any
          mode: box
          unit_of_measurement: "°"
    scale:
      name: Scale
      description: Metres per native map unit. Native units are millimetres.
      default: 0.001
      selector:
        number:
          min: 0
          step: any
          mode: box

clear_georeference:
  name: Clear map georeference
  description: >-
    Remove the current map's stored map-to-GPS calibration, preserving other
    maps. The derived GPS position becomes unknown until a new calibration is
    set. Does not reload the integration.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower

plan_map_preference_mode_update:
  name: Plan map preference mode update
  description: >-
    Build or send a guarded preference-mode update for the selected map on the
    mower entity. This only changes the selected map between global and custom
    preference mode and does not require any zone selection. By default this is
    a dry run that only stores the candidate PREP request in the last
    preference write diagnostic sensor. Sending the request requires execute
    and confirm_preference_write to both be true.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    preference_mode:
      name: Preference mode
      description: >-
        Map preference mode, either global/custom or 0/1. This sends the
        guarded PREP mode request for the selected map.
      required: true
      selector:
        select:
          options:
            - label: global
              value: global
            - label: custom
              value: custom
    execute:
      name: Execute
      description: Send the write request instead of only building a dry-run preview.
      default: false
      selector:
        boolean: {}
    confirm_preference_write:
      name: Confirm preference write
      description: Required together with execute before the preference write is sent.
      default: false
      selector:
        boolean: {}

plan_zone_mowing_preference_update:
  name: Plan zone mowing preference update
  description: >-
    Build or send a guarded mowing preference update for the selected map on
    the mower entity. Zone-scoped settings use the current Home Assistant
    map/zone selection scope unless zone_id is provided explicitly. Map-level
    preference_mode updates can be planned without any zone selection. By
    default this is a dry run that only stores the candidate PRE/PREP request
    in the last preference write diagnostic sensor. Sending the request
    requires execute and confirm_preference_write to both be true.
  target:
    entity:
      integration: dreame_lawn_mower
      domain: lawn_mower
  fields:
    zone_id:
      name: Zone ID
      description: >-
        Optional explicit current-map zone id. Defaults to the selected zone
        when changing per-area preference settings. Not required for
        preference_mode-only requests.
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    preference_mode:
      name: Preference mode
      description: >-
        Map preference mode, either global/custom or 0/1. This sends the
        guarded PREP mode request and can be combined with per-area settings
        only when switching to custom mode.
      selector:
        select:
          options:
            - label: global
              value: global
            - label: custom
              value: custom
    execute:
      name: Execute
      description: Send the write request instead of only building a dry-run preview.
      default: false
      selector:
        boolean: {}
    confirm_preference_write:
      name: Confirm preference write
      description: Required together with execute before the preference write is sent.
      default: false
      selector:
        boolean: {}
    efficient_mode:
      name: Efficiency mode
      description: 0 is Standard, 1 is Efficient, and supported A3/A3 Pro variants also accept 3 for Rush. Other values are rejected.
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    mowing_height_cm:
      name: Mowing height (cm)
      description: Target cutting height in centimeters.
      selector:
        number:
          min: 1
          max: 20
          step: 0.1
          mode: box
    mowing_direction_mode:
      name: Mowing direction mode
      description: Integer mode value, with 0 none, 1 mow at angle, or 2 checkerboard.
      selector:
        number:
          min: 0
          max: 2
          step: 1
          mode: box
    mowing_direction_degrees:
      name: Mowing direction degrees
      description: Direction angle from 0 to 180 degrees.
      selector:
        number:
          min: 0
          max: 180
          step: 1
          mode: box
    edge_mowing_auto:
      name: Automatic edge mowing
      selector:
        boolean: {}
    edge_mowing_walk_mode:
      name: Turning method
      description: Integer mode value, with 0 lawn care or 1 efficient.
      selector:
        number:
          min: 0
          max: 1
          step: 1
          mode: box
    edge_mowing_obstacle_avoidance:
      name: Edge obstacle avoidance
      selector:
        boolean: {}
    cutter_position:
      name: Cutter position
      description: Integer cutter position, typically 0 center or 1 left.
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: box
    edge_mowing_num:
      name: Edge mowing passes
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: box
    obstacle_avoidance_enabled:
      name: Obstacle avoidance enabled
      selector:
        boolean: {}
    obstacle_avoidance_height_cm:
      name: Obstacle avoidance height (cm)
      selector:
        number:
          min: 0
          max: 50
          step: 1
          mode: box
    obstacle_avoidance_distance_cm:
      name: Obstacle avoidance distance (cm)
      selector:
        number:
          min: 0
          max: 50
          step: 1
          mode: box
    obstacle_avoidance_ai_classes:
      name: AI obstacle classes
      description: Choose any of people, animals, and objects.
      selector:
        select:
          multiple: true
          options:
            - people
            - animals
            - objects
    edge_mowing_safe:
      name: Safe edge mowing
      selector:
        boolean: {}
    edge_cutting_attachment:
      name: EdgeMaster
      description: Enable or disable the mower's EdgeMaster edge-cutting attachment.
      selector:
        boolean: {}

remote_control_step:
  name: Remote control step
  description: >-
    Send one validated manual-drive movement step to the mower. This can
    physically move the mower and is intended for short supervised tests only.
    The service is blocked while the mower is mowing, returning, mapping, fast
    mapping, in error, or below 20% battery.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when multiple Dreame lawn mower entries are loaded.
      selector:
        text: {}
    rotation:
      name: Rotation
      description: Signed rotation speed from -1000 to 1000.
      required: true
      selector:
        number:
          min: -1000
          max: 1000
          step: 1
          mode: box
    velocity:
      name: Velocity
      description: Signed forward/backward speed from -1000 to 1000.
      required: true
      selector:
        number:
          min: -1000
          max: 1000
          step: 1
          mode: box
    prompt:
      name: Prompt
      description: Whether to allow the vendor protocol to request confirmation.
      default: false
      selector:
        boolean: {}

remote_control_stop:
  name: Remote control stop
  description: Send a zero-motion remote-control step to stop manual driving.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when multiple Dreame lawn mower entries are loaded.
      selector:
        text: {}

set_schedule_plan_enabled:
  name: Set schedule plan enabled
  description: >-
    Build or send a guarded app-schedule enable/disable request. By default this
    is a dry run that only shows the request payload in a notification. Sending
    the request requires execute and confirm_schedule_write to both be true.
    Use only during supervised testing.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when multiple Dreame lawn mower entries are loaded.
      selector:
        text: {}
    map_index:
      name: Map index
      description: Schedule map index, for example 0 or -1 for the default slot.
      required: true
      selector:
        number:
          min: -1
          max: 20
          step: 1
          mode: box
    plan_id:
      name: Plan ID
      description: Schedule plan id to enable or disable.
      required: true
      selector:
        number:
          min: 0
          max: 20
          step: 1
          mode: box
    enabled:
      name: Enabled
      description: Whether the selected schedule plan should be enabled.
      required: true
      selector:
        boolean: {}
    execute:
      name: Execute
      description: Send the write request instead of only building a dry-run preview.
      default: false
      selector:
        boolean: {}
    confirm_schedule_write:
      name: Confirm schedule write
      description: Required together with execute before the schedule write is sent.
      default: false
      selector:
        boolean: {}

set_schedule_task_start_time:
  name: Set existing schedule start time
  description: >-
    Preview or change one existing all-area mowing start on an A2 V3 schedule.
    Qualified for map 0, plan 0. Preserves other tasks, names and enable flags.
    The mower must have finished its current task. Defaults to a dry run;
    sending requires execute and confirm_schedule_write. Creation, weekday
    changes and area edits remain unavailable.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when multiple Dreame lawn mower entries are loaded.
      selector:
        text: {}
    map_index:
      name: Map index
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 0
          mode: box
    plan_id:
      name: Plan ID
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 0
          mode: box
    week_day:
      name: Weekday
      description: Sunday is 0, Monday is 1, and Saturday is 6.
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    task_index:
      name: Task index
      description: Zero-based position among the selected day's existing tasks.
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    start_time:
      name: Start time
      description: Local mower time with whole-minute precision.
      required: true
      selector:
        time: {}
    execute:
      name: Execute
      default: false
      selector:
        boolean: {}
    confirm_schedule_write:
      name: Confirm schedule write
      default: false
      selector:
        boolean: {}

plan_schedule_upload:
  name: Plan schedule upload
  description: >-
    Build or send a guarded full schedule upload for one map slot. Provide a
    list of decoded schedule plans in the same readable shape returned by the
    schedule probe and calendar helpers. By default this is a dry run that only
    stores the candidate SCHDIV2/SCHDDV2 request sequence in the last schedule
    write diagnostic sensor. Sending the upload requires execute and
    confirm_schedule_write to both be true.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when multiple Dreame lawn mower entries are loaded.
      selector:
        text: {}
    map_index:
      name: Map index
      description: Schedule map index, for example 0 or -1 for the default slot.
      required: true
      selector:
        number:
          min: -1
          max: 20
          step: 1
          mode: box
    plans:
      name: Plans
      description: >-
        Full readable schedule plan list to upload. Each plan should include
        plan_id, enabled, name, and optional weeks/tasks entries.
      required: true
      selector:
        object: {}
    chunk_size:
      name: Chunk size
      description: >-
        Optional UTF-8 upload chunk size in bytes. Leave at the default unless
        you are debugging chunk boundaries.
      default: 100
      selector:
        number:
          min: 1
          max: 500
          step: 1
          mode: box
    execute:
      name: Execute
      description: Send the upload request sequence instead of only building a dry-run preview.
      default: false
      selector:
        boolean: {}
    confirm_schedule_write:
      name: Confirm schedule write
      description: Required together with execute before the schedule upload is sent.
      default: false
      selector:
        boolean: {}

plan_maintenance_reset:
  name: Plan maintenance reset
  description: >-
    Build or send a guarded CMS maintenance counter reset. By default this is
    a dry run that only shows the candidate CMS request in a notification and
    the diagnostic sensor. Sending the request requires execute and
    confirm_maintenance_reset to both be true.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when multiple Dreame lawn mower entries are loaded.
      selector:
        text: {}
    item:
      name: Maintenance item
      description: CMS maintenance counter to reset.
      required: true
      selector:
        select:
          options:
            - label: Blade
              value: blade
            - label: Cleaning Brush
              value: brush
            - label: Robot Maintenance
              value: robot
            - label: Edge Trimmer (confirmed A3 attachment only)
              value: edge_trimmer
    execute:
      name: Execute
      description: Send the reset request instead of only building a dry-run preview.
      default: false
      selector:
        boolean: {}
    confirm_maintenance_reset:
      name: Confirm maintenance reset
      description: Required together with execute before the reset is sent.
      default: false
      selector:
        boolean: {}

plan_mowing_preference_update:
  name: Plan mowing preference update
  description: >-
    Build or send a guarded mower preference update from the current app
    preference payload. By default this is a dry run that only shows the
    candidate request payload in a notification and the diagnostic sensor.
    Sending the request requires execute and confirm_preference_write to both
    be true.
  fields:
    entry_id:
      name: Config entry ID
      description: Required only when multiple Dreame lawn mower entries are loaded.
      selector:
        text: {}
    map_index:
      name: Map index
      description: App preference map index, for example 0.
      required: true
      selector:
        number:
          min: 0
          max: 20
          step: 1
          mode: box
    area_id:
      name: Area ID
      description: Preference area id returned by the mower app protocol.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    execute:
      name: Execute
      description: Send the write request instead of only building a dry-run preview.
      default: false
      selector:
        boolean: {}
    confirm_preference_write:
      name: Confirm preference write
      description: Required together with execute before the preference write is sent.
      default: false
      selector:
        boolean: {}
    efficient_mode:
      name: Efficiency mode
      description: 0 is Standard, 1 is Efficient, and supported A3/A3 Pro variants also accept 3 for Rush. Other values are rejected.
      selector:
        number:
          min: 0
          max: 3
          step: 1
          mode: box
    mowing_height_cm:
      name: Mowing height (cm)
      description: Target cutting height in centimeters.
      selector:
        number:
          min: 1
          max: 20
          step: 0.1
          mode: box
    mowing_direction_mode:
      name: Mowing direction mode
      description: Integer mode value, with 0 none, 1 mow at angle, or 2 checkerboard.
      selector:
        number:
          min: 0
          max: 2
          step: 1
          mode: box
    mowing_direction_degrees:
      name: Mowing direction degrees
      description: Direction angle from 0 to 180 degrees.
      selector:
        number:
          min: 0
          max: 180
          step: 1
          mode: box
    edge_mowing_auto:
      name: Automatic edge mowing
      selector:
        boolean: {}
    edge_mowing_walk_mode:
      name: Turning method
      description: Integer mode value, with 0 lawn care or 1 efficient.
      selector:
        number:
          min: 0
          max: 1
          step: 1
          mode: box
    edge_mowing_obstacle_avoidance:
      name: Edge obstacle avoidance
      selector:
        boolean: {}
    cutter_position:
      name: Cutter position
      description: Integer cutter position, typically 0 center or 1 left.
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: box
    edge_mowing_num:
      name: Edge mowing passes
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: box
    obstacle_avoidance_enabled:
      name: Obstacle avoidance enabled
      selector:
        boolean: {}
    obstacle_avoidance_height_cm:
      name: Obstacle avoidance height (cm)
      selector:
        number:
          min: 0
          max: 50
          step: 1
          mode: box
    obstacle_avoidance_distance_cm:
      name: Obstacle avoidance distance (cm)
      selector:
        number:
          min: 0
          max: 50
          step: 1
          mode: box
    obstacle_avoidance_ai_classes:
      name: AI obstacle classes
      description: Choose any of people, animals, and objects.
      selector:
        select:
          multiple: true
          options:
            - people
            - animals
            - objects
    edge_mowing_safe:
      name: Safe edge mowing
      selector:
        boolean: {}
    edge_cutting_attachment:
      name: EdgeMaster
      description: Enable or disable the mower's EdgeMaster edge-cutting attachment.
      selector:
        boolean: {}
