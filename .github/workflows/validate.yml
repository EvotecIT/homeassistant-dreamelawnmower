name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  test:
    name: Tests (HA ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            home-assistant: "2025.1"
            test-plugin: "0.13.201"
          - python: "3.13"
            home-assistant: "2026.2"
            test-plugin: "0.13.316"
          - python: "3.14"
            home-assistant: "2026.9"
            test-plugin: "0.13.367"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          constraints=()
          if [[ "${{ matrix.home-assistant }}" == "2025.1" ]]; then
            constraints=(--constraint .github/ha-minimum-test-constraints.txt)
          fi
          python -m pip install "${constraints[@]}" -e .[test] "pytest-homeassistant-custom-component==${{ matrix.test-plugin }}"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          pytest tests
          --ignore=tests/components
          --ignore=tests/test_translations.py

      - name: Home Assistant component and translation tests
        run: >-
          pytest
          tests/components
          tests/test_translations.py

  ha-dependencies:
    name: Home Assistant dependencies (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install integration requirements and exercise map optimization
        env:
          HOME_ASSISTANT_IMAGE: ghcr.io/home-assistant/home-assistant:2026.9.2
        run: |
          docker run --rm -i \
            --entrypoint python \
            --volume "$PWD:/work:ro" \
            --workdir /work \
            --env PYTHONPATH=/work \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$HOME_ASSISTANT_IMAGE" - <<'PY'
          import importlib
          import json
          from pathlib import Path
          from homeassistant.requirements import pip_kwargs
          from homeassistant.util.package import install_package

          manifest = json.loads(Path("custom_components/dreame_lawn_mower/manifest.json").read_text())
          for requirement in [*manifest["requirements"], "pytest"]:
              assert install_package(requirement, **pip_kwargs("/config")), requirement
          importlib.import_module("custom_components.dreame_lawn_mower.config_flow")

          import pytest
          raise SystemExit(pytest.main(["tests/test_map_optimizer.py", "-q", "-p", "no:cacheprovider"]))
          PY

  xp2p-runtime-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate native runtime in Home Assistant Container
        env:
          HOME_ASSISTANT_IMAGE: >-
            ghcr.io/home-assistant/home-assistant:2026.7.2
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env DREAME_XP2P_REAL_RUNTIME_TEST=1 \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$HOME_ASSISTANT_IMAGE" \
            bash -ceu '
              python -m pip install --disable-pip-version-check pytest
              python -m pytest tests/test_xp2p_host_runtime.py \
                -k real_managed_worker_accepts_request_on_native_host
            '
