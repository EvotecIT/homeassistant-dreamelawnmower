name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Ruff
        run: ruff check .

      - name: Pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          pytest tests
          --ignore=tests/components
          --ignore=tests/test_translations.py

      - name: Home Assistant component and translation tests
        run: >-
          pytest
          tests/components
          tests/test_translations.py

  xp2p-runtime-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate native runtime in Home Assistant Container
        env:
          HOME_ASSISTANT_IMAGE: >-
            ghcr.io/home-assistant/home-assistant:2026.7.2
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env DREAME_XP2P_REAL_RUNTIME_TEST=1 \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$HOME_ASSISTANT_IMAGE" \
            bash -ceu '
              python -m pip install --disable-pip-version-check pytest
              python -m pytest tests/test_xp2p_host_runtime.py \
                -k real_managed_worker_accepts_request_on_native_host
            '
